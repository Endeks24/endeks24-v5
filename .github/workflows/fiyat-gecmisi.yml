name: endeks24-fiyat-gecmisi
# Günlük kapanışlar (fiyat/), aracı kurum tahmin kopyası, Endeksi kim taşıdı ve bilanço sürprizi (analiz/). Hafta içi seans sonrası; yapay zeka çağrısı yoktur.
on:
  schedule:
    - cron: '47 15 * * 1-5'
  workflow_dispatch:
    inputs:
      tam:
        description: 'Baştan oku (evet)'
        required: false
        default: 'hayır'
permissions:
  contents: write
concurrency:
  group: endeks24-fiyat-gecmisi
  cancel-in-progress: false
jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Hesap
        env:
          FINTABLES: ${{ secrets.FINTABLES }}
        run: |
          set -o pipefail
          EK=""; if [ "${{ github.event.inputs.tam }}" = "evet" ]; then EK="--tam"; fi
          python3 veri-programi/fiyat_gecmisi.py . $EK 2>&1 | tee fiyat-log.txt
      - name: Analiz (tahmin kopyası, endeksi taşıyanlar, bilanço sürprizi)
        continue-on-error: true
        env:
          FINTABLES: ${{ secrets.FINTABLES }}
        run: |
          set -o pipefail
          for m in tahmin tasiyici surpriz; do python3 veri-programi/analiz.py $m . 2>&1 | tee -a fiyat-log.txt || echo "UYARI: $m çalışmadı"; done
      - name: Yaz
        run: |
          git config user.name e24-fiyat; git config user.email e24-fiyat@users.noreply.github.com
          git add fiyat analiz
          git commit -qm "fiyat $(TZ=Europe/Istanbul date '+%d.%m.%Y')" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
