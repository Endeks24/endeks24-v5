name: evds-deneme
on:
  push:
    branches: [veri-kesif]
    paths: [.github/workflows/fintables-kesif.yml]
permissions:
  contents: write
jobs:
  deneme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EVDS
        env:
          K: ${{ secrets.EVDS }}
        run: |
          mkdir -p kesif; o=kesif/sonuc.txt; : > $o
          echo "anahtar uzunlugu: ${#K}" >> $o
          for u in "https://evds3.tcmb.gov.tr/igmevdsms-dis/datagroup=bie_abres2&startDate=01-10-2026&endDate=19-10-2026&type=json" "https://evds3.tcmb.gov.tr/igmevdsms-dis/serieList/type=json&code=bie_kkhartut"; do
            echo "== $u" >> $o; curl -sS -m 30 -w "\nHTTP %{http_code}\n" -H "key: $K" "$u" | head -c 1200 >> $o; echo >> $o; done
      - name: Yaz
        run: |
          git config user.name e24-bot; git config user.email e24-bot@users.noreply.github.com
          git add kesif/sonuc.txt; git commit -qm "evds deneme sonucu"; git push
