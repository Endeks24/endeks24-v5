name: endeks24-veri
# Seans boyunca 15 dakikada bir BIST + kripto; geri kalan saatlerde saat başı yalnız kripto. Sonuç "veri" dalına yazılır.
on:
  schedule:
    - cron: '*/15 7-15 * * 1-5'
    - cron: '41 * * * *'
    # 24.10.2026: açılış için yedekli erken zamanlama (UTC 06.33 ve 06.49 = TR 09.33 ve 09.49). GitHub zamanlanmış çalışmaları geciktirebilir ya da atlayabilir;
    # bunlardan biri 10.02'den önce başlarsa aşağıdaki bekleme açılış verisini tam 10.02'de yazar. Aynı anda tek çalışma kalır (concurrency).
    - cron: '33 6 * * 1-5'
    - cron: '49 6 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [veri-programi/**, .github/workflows/veri.yml]
permissions:
  contents: write
concurrency:
  group: endeks24-veri
  cancel-in-progress: false
jobs:
  veri:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Veri dalı
        run: |
          git fetch origin veri:veri 2>/dev/null && git worktree add -q cikti veri || { git worktree add -q --orphan -b veri cikti 2>/dev/null || { mkdir cikti; cd cikti; git init -q -b veri; }; }
      - name: Program
        env:
          FINTABLES: ${{ secrets.FINTABLES }}
        run: |
          set -o pipefail
          H=$(TZ=Europe/Istanbul date +%u%H%M); g=${H:0:1}; s=$((10#${H:1:4}))
          # 22.10.2026: GitHub zamanlaması 10-30 dk gecikebiliyor. 09.30-10.02 arası başlayan iş günü çalışması 10.02'yi bekler,
          # böylece açılış verisi 10.00 zamanlamasının gecikmesine kalmaz.
          if [ "${{ github.event_name }}" = schedule ] && [ "$g" -le 5 ] && [ $s -ge 930 ] && [ $s -lt 1002 ]; then
            sleep $(( $(TZ=Europe/Istanbul date -d 'today 10:02' +%s) - $(date +%s) )); H=$(TZ=Europe/Istanbul date +%u%H%M); s=$((10#${H:1:4}))
          fi
          EK=""
          # Seans kapanış yazısı yazılmadıysa (son seans çalışması geciktiyse) akşam ilk çalışma tam çalışır
          ACIK=$(python3 -c "import json;print(json.load(open('cikti/veri.json'))['veri']['piyasa']['seans'].get('durum',''))" 2>/dev/null || true)
          if [ "$g" -gt 5 ] || [ $s -lt 1000 ] || [ $s -gt 1830 ]; then EK="--kripto-yalniz"; fi
          if [ "$g" -le 5 ] && [ $s -gt 1830 ] && [ "$ACIK" = acik ]; then EK=""; fi
          if [ "${{ github.event_name }}" != schedule ]; then EK=""; fi  # elle ya da kod değişince tam deneme
          python3 veri-programi/fintables_veri.py cikti/veri.json $EK 2>&1 | tee cikti/son-calisma.txt || echo "BASARISIZ" >> cikti/son-calisma.txt
          echo "$(date -u +%FT%TZ) $EK" >> cikti/son-calisma.txt
      - name: Canlı borsa
        env:
          FINTABLES: ${{ secrets.FINTABLES }}
        run: |
          # 26.10.2026: Borsa Ekranı günlük kapanış verisiyle gelir; seans açıkken BIST 100 gün içi, fiyat ve değişim buradan örtülür (borsa/canli.json).
          H=$(TZ=Europe/Istanbul date +%u%H%M); g=${H:0:1}; s=$((10#${H:1:4}))
          if [ "$g" -le 5 ] && [ $s -ge 1000 ] && [ $s -le 1830 ]; then
            python3 veri-programi/borsa_veri.py cikti --canli 2>&1 | tail -5 || true
          fi
      - name: Yaz
        run: |
          cd cikti
          git config user.name e24-veri; git config user.email e24-veri@users.noreply.github.com
          git add -A; git commit -qm "veri $(TZ=Europe/Istanbul date '+%d.%m %H.%M')" || exit 0
          git push -q origin HEAD:veri
          grep -q BASARISIZ son-calisma.txt && exit 1 || true
