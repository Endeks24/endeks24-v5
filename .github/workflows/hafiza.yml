name: endeks24-hafiza
# KAP kararları sonrası fiyat hafızası (bedelsiz, temettü, bedelli). Ayda bir ya da elle; sonuç main kökündeki hafiza.json. Yapay zeka çağrısı yoktur.
on:
  schedule:
    - cron: '17 4 2 * *'
  workflow_dispatch:
    inputs:
      dene:
        description: 'Kısa deneme (2 ay, dosya yazılmaz)'
        required: false
        default: 'hayır'
      ay:
        description: 'Pencere (ay)'
        required: false
        default: '36'
      tani:
        description: 'Tanı dökümü ve önbelleksiz tarama (evet)'
        required: false
        default: 'hayır'
      imza:
        description: 'İmza dökümü (evet)'
        required: false
        default: 'hayır'
permissions:
  contents: write
concurrency:
  group: endeks24-hafiza
  cancel-in-progress: false
jobs:
  hafiza:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Hesap
        env:
          FINTABLES: ${{ secrets.FINTABLES }}
        run: |
          set -o pipefail
          EK=""
          if [ "${{ github.event.inputs.dene }}" = "evet" ]; then EK="--dene"; fi
          if [ "${{ github.event.inputs.imza }}" = "evet" ]; then EK="$EK --imza"; fi
          if [ "${{ github.event.inputs.tani }}" = "evet" ]; then EK="$EK --tani --onbellek-yok"; fi
          AY="${{ github.event.inputs.ay }}"; AY=${AY:-36}
          python3 veri-programi/hafiza_hesapla.py cikti $EK --pencere-ay $AY 2>&1 | tee hafiza-log.txt
      - name: Yaz
        if: ${{ github.event.inputs.dene != 'evet' }}
        run: |
          cp cikti/hafiza.json hafiza.json; cp cikti/hafiza-olaylar.json hafiza-olaylar.json; cp cikti/hafiza-olay-onbellek.json hafiza-olay-onbellek.json
          git config user.name e24-hafiza; git config user.email e24-hafiza@users.noreply.github.com
          git add hafiza.json hafiza-olaylar.json hafiza-olay-onbellek.json
          git commit -qm "hafiza $(TZ=Europe/Istanbul date '+%d.%m.%Y')" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
