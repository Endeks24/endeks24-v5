<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Endeks24 Fintables Bağlantısı</title>
<style>
:root{--bg:#f6f7f9;--kart:#fff;--yazi:#16202c;--soluk:#5b6675;--vurgu:#c8102e;--cizgi:#dfe3e8;--iyi:#137a3a;--kotu:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--kart:#18202a;--yazi:#e8edf2;--soluk:#9aa6b4;--cizgi:#2a3542;--iyi:#4ade80;--kotu:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:24px}
h1{font-size:22px;margin:0 0 6px}p{margin:8px 0}.soluk{color:var(--soluk);font-size:14px}
button,a.dugme{display:block;width:100%;margin:16px 0 0;padding:14px;border:0;border-radius:10px;background:var(--vurgu);color:#fff;font-size:17px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
button.ikinci,a.ikinci{background:transparent;color:var(--yazi);border:1px solid var(--cizgi)}
.durum{margin-top:14px;font-weight:600}.iyi{color:var(--iyi)}.kotu{color:var(--kotu)}
textarea{width:100%;height:96px;margin-top:10px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--cizgi);border-radius:8px;padding:8px;background:var(--bg);color:var(--yazi)}
ol{padding-left:20px}li{margin:6px 0}
</style>
</head>
<body><main><div class="kart" id="k">
<h1>Fintables bağlantısı</h1>
<p>Endeks24 veri programının Fintables'tan veri okuyabilmesi için bir kez izin verilir. İzin salt okumadır.</p>
<p class="soluk">Şifreniz yalnızca Fintables'ın kendi sayfasına girilir; bu sayfa şifreyi görmez.</p>
<button id="basla">Fintables ile giriş yap</button>
<div id="d" class="durum"></div>
</div></main>
<script>
var AS='https://evo.fintables.com',KAYNAK='https://evo.fintables.com/mcp',DON=location.origin+location.pathname;
var k=document.getElementById('k'),d=document.getElementById('d');
function yaz(t,c){d.className='durum '+(c||'');d.textContent=t;}
function b64(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function rast(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a);}
async function basla(){
  try{
    yaz('Hazırlanıyor…');
    var m=await (await fetch(AS+'/.well-known/oauth-authorization-server')).json();
    var r=await fetch(m.registration_endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_name:'Endeks24 veri programi',redirect_uris:[DON],grant_types:['authorization_code'],response_types:['code'],token_endpoint_auth_method:'none'})});
    if(!r.ok)throw new Error('Kayıt reddedildi ('+r.status+'): '+(await r.text()).slice(0,200));
    var c=await r.json(),v=rast(48),s=rast(16);
    var ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
    sessionStorage.setItem('e24f',JSON.stringify({id:c.client_id,v:v,s:s,t:m.token_endpoint}));
    location.href=m.authorization_endpoint+'?'+new URLSearchParams({response_type:'code',client_id:c.client_id,redirect_uri:DON,code_challenge:ch,code_challenge_method:'S256',state:s,resource:KAYNAK});
  }catch(e){yaz('Başlatılamadı: '+e.message,'kotu');}
}
async function don(q){
  var st=JSON.parse(sessionStorage.getItem('e24f')||'null');
  history.replaceState(null,'',DON);
  if(q.get('error')){yaz('Fintables izin vermedi: '+q.get('error'),'kotu');return;}
  if(!st||q.get('state')!==st.s){yaz('Oturum eşleşmedi. Lütfen baştan deneyin.','kotu');return;}
  yaz('İzin alındı, anahtar oluşturuluyor…');
  try{
    var r=await fetch(st.t,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code:q.get('code'),redirect_uri:DON,client_id:st.id,code_verifier:st.v,resource:KAYNAK})});
    var j=await r.json();sessionStorage.removeItem('e24f');
    if(!r.ok||!j.access_token)throw new Error((j.error||r.status)+' '+(j.error_description||''));
    var sure=j.expires_in?Math.round(j.expires_in/3600):null;
    var paket=btoa(JSON.stringify({a:j.access_token,r:j.refresh_token||null,id:st.id,t:st.t,bitis:j.expires_in?Date.now()+j.expires_in*1000:null}));
    k.innerHTML='<h1>Bağlantı kuruldu</h1><p class="durum iyi">Anahtar geçerlilik süresi: '+(sure===null?'belirtilmedi':sure>=48?Math.round(sure/24)+' gün':sure+' saat')+(j.refresh_token?' (kendini yenileyebilir)':'')+'</p>'+
      '<p>Bu süreyi Claude\'a yazın. Ardından anahtarı GitHub\'a kaydedin:</p><ol><li>Aşağıdaki <b>Anahtarı kopyala</b> düğmesine basın.</li><li><b>GitHub\'da kaydet</b> düğmesiyle açılan sayfada Name alanına <b>FINTABLES</b> yazın, Secret alanına yapıştırın, <b>Add secret</b> deyin.</li></ol>'+
      '<textarea id="p" readonly></textarea><button id="kop">Anahtarı kopyala</button><a class="dugme ikinci" target="_blank" rel="noopener" href="https://github.com/Endeks24/endeks24-v5/settings/secrets/actions/new">GitHub\'da kaydet</a><p class="soluk">Anahtarı başka bir yere yapıştırmayın, Claude\'a da göndermeyin. Sayfayı kapatınca anahtar burada da kalmaz.</p>';
    var p=document.getElementById('p');p.value=paket;
    document.getElementById('kop').onclick=function(){p.select();(navigator.clipboard?navigator.clipboard.writeText(paket):Promise.reject()).then(function(){document.getElementById('kop').textContent='Kopyalandı';},function(){document.execCommand('copy');document.getElementById('kop').textContent='Kopyalandı';});};
  }catch(e){yaz('Anahtar alınamadı: '+e.message,'kotu');}
}
document.getElementById('basla').onclick=basla;
var q=new URLSearchParams(location.search);if(q.get('code')||q.get('error'))don(q);
</script>
</body></html>
